{{- /* Rendered only when the cluster serves the CEL PolicyException API, or when policyException.enforce forces it (renders without cluster access, e.g. kustomize helmCharts). At management cluster bootstrap Kyverno is not installed yet, so it must not render. */}}
{{- if and (or (.Capabilities.APIVersions.Has "policies.kyverno.io/v1/PolicyException") (eq .Values.policyException.enforce true)) .Values.kyvernoPolicyExceptions.enabled }}
{{- $ksmServiceAccount := "" }}
{{- if .Values.kubeStateMetrics.enabled }}
{{- /* Name of the kube-state-metrics subchart's ServiceAccount, from the subchart's helpers. */}}
{{- $ksmName := include "kube-state-metrics.fullname" (dict "Values" .Values.kubeStateMetrics "Release" .Release "Chart" (dict "Name" "kube-state-metrics")) }}
{{- $ksmServiceAccount = default $ksmName .Values.kubeStateMetrics.serviceAccount.name }}
{{- end }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ .Release.Name | quote }}
  {{- if (.Values.policyException).namespace }}
  namespace: {{ .Values.policyException.namespace }}
  {{- end }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    # Lower than every hook of the chart (the lowest is -7), so the exception
    # exists before the flux-app-crd-install ServiceAccount (-4) and Job (-1)
    # and the flux-migrate Job (-2) are created.
    "helm.sh/hook-weight": "-8"
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  policyRefs:
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  # check-resources-request-and-limits-ratio is a supplemental policy and
  # usually not enabled. It is excepted because the Flux controller
  # Deployments and their Pods fail it when the policy is enforced.
  - name: check-resources-request-and-limits-ratio
    kind: ValidatingPolicy
  # require-emptydir-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the Flux controller Deployments and
  # their Pods fail it when the policy is enforced.
  - name: require-emptydir-requests-and-limits
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the flux-app-flux-migrate Job and its
  # Pods fail it when the policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-pod-probes is a supplemental policy and usually not enabled. It is
  # excepted because the flux-app-crd-install and flux-app-flux-migrate Job
  # Pods fail it when the policy is enforced.
  - name: require-pod-probes
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the Flux controller, flux-app-crd-install
  # and kube-state-metrics ServiceAccounts fail it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  # Block 1 is the legacy match. ServiceAccount is matched for
  # restrict-sa-automount-sa-token. No legacy exception covers the
  # kube-state-metrics ServiceAccount, so block 2 (only with
  # kubeStateMetrics.enabled) matches it by kind, namespace and name.
  - name: flux-workloads
    expression: >-
      (request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'Job', 'ServiceAccount'] &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      ((object.metadata.name == 'helm-controller' || object.metadata.name.startsWith('helm-controller-')) ||
      (object.metadata.name == 'image-automation-controller' || object.metadata.name.startsWith('image-automation-controller-')) ||
      (object.metadata.name == 'image-reflector-controller' || object.metadata.name.startsWith('image-reflector-controller-')) ||
      (object.metadata.name == 'kustomize-controller' || object.metadata.name.startsWith('kustomize-controller-')) ||
      (object.metadata.name == 'notification-controller' || object.metadata.name.startsWith('notification-controller-')) ||
      (object.metadata.name == 'source-controller' || object.metadata.name.startsWith('source-controller-')) ||
      (object.metadata.name == 'source-watcher' || object.metadata.name.startsWith('source-watcher-')) ||
      (object.metadata.name == 'flux-app-crd-install' || object.metadata.name.startsWith('flux-app-crd-install-')) ||
      (object.metadata.name == 'flux-app-flux-migrate' || object.metadata.name.startsWith('flux-app-flux-migrate-'))))
      {{- if $ksmServiceAccount }} ||
      (request.kind.kind == 'ServiceAccount' &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      object.metadata.name == '{{ $ksmServiceAccount }}')
      {{- end }}
{{- end }}
